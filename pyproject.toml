[project]
name = "pattern"
version = "3.0.0"
description = "Pattern - A modern, opinionated, cookiecutter template for your next Python project."
authors = [{ name = "Wyatt Ferguson", email = "wyattxdev@duck.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ['cookiecutter', 'template', 'uv', 'python', 'project', 'generator', 'pattern']
requires-python = ">=3.13,<4"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
  "cookiecutter>=2.7.1",
]

[dependency-groups]
dev = [
    "ty>=0.0.65",
    "pytest>=9.1.1",
    "pytest-cookies>=0.7.0",
    "ruff>=0.16.1",
    "taskipy>=1.14.1",
    "toml>=0.10.2",
    "zensical>=0.0.52",
    "cffconvert>=2.0.0",
]

[project.urls]
Repository = "https://github.com/wyattferguson/pattern"
Documentation = "https://wyattferguson.github.io/pattern"
Issues = "https://github.com/wyattferguson/pattern/issues"

[tool.taskipy.tasks]
format = { cmd = "ruff format ./tests/ ./hooks/", help = "Format code using ruff" }
lint = { cmd = "ruff check --fix ./tests/ ./hooks/", help = "Lint code using ruff" }
type = { cmd = "ty check", help = "Typecheck code using ty" }
tests = { cmd = "pytest -v --color=yes tests", help = "Run all tests using pytest" }
docs = { cmd = "zensical build", help = "Build documentation using zensical" }
serve = { cmd = "zensical serve", help = "Serve documentation using zensical" }
upgrade = { cmd = "uv sync --upgrade", help = "Upgrade all dependencies to latest versions."}

[tool.ruff]
line-length = 100
indent-width = 4
format.indent-style = "space"
target-version = "py313"
src = ["tests","hooks"]

[tool.ruff.lint]
pydocstyle.convention = "google"
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "FA102", # Flake8-future-annotations
    "F401", # Disable fix for unused imports
    "B904", # Allow raising exceptions without from e
    "PLR0913", # too many arguments
    "CPY", # Flake8-copyright
    "T201", # Debugging print statements
    "ERA", # Eradicate – detects commented-out code
    "BLE001", # Catch-all exceptions
    "D100", # missing docstring in public module
    "D105", # undocumented magic method
    "D107", # undocumented public init
    "D203", # incorrect-blank-line-before-class
    "D205", # line-between-summary-and-description
    "D212", # multi-line-summary-first-line
    "D407", # missing-dashed-underline-after-section
    "S311", # rand-usage
    "S602", # subprocess shell=True (cross-platform cookiecutter hook)
    "S607", # partial executable path (uv/git on PATH)
    "C901", # hook complexity (linear if-chain by design)
    "PLR0133", # jinja constant comparison (cookiecutter pattern)
    "TC002", # pytest_cookies is untyped; kept behind type: ignore
]

[tool.ty]
terminal.output-format = "full"

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["tests/**/*.py", "hooks/**/*.py"]

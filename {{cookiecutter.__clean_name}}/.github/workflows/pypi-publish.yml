# Release automation with python-semantic-release + trusted publishing.
#
# Flow:
#   1. Push to `main` -> python-semantic-release inspects conventional commits,
#      bumps the version in pyproject.toml, updates CHANGELOG.md, and pushes a
#      `v*.*.*` tag (no release -> no-op).
#   2. Tag push -> build the package, generate PEP 740 attestations, and
#      publish to PyPI via Trusted Publishing (no API token required).
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   - Add a trusted publisher for this repository:
#       Workflow name: pypi-publish.yml
#       Environment:   pypi
#       Repository:    <owner>/{{ cookiecutter.repository_name }}

name: Release & Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version bump + tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - name: Create release
        run: uv run python-semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing + attestations
      attestations: write # PEP 740 attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - name: Build package
        run: uv build
      - name: Generate attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish package
        run: uv publish
      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF#refs/tags/}" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
